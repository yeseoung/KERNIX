# Runs the public test suite (test/test.mk) on Apple Silicon for every push to main and every pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest  # Apple Silicon: the build uses -mcpu=apple-m1, Accelerate and Metal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch: PyTorch export and reference outputs; tensorflow: Keras export and reference outputs
      - run: python -m venv .venv && .venv/bin/pip install torch==2.14.1 tensorflow==2.21.0
      - run: make test
